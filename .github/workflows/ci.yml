name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# A newer push to the same branch/PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - name: ruff (unused code, undefined names, likely bugs)
        run: ruff check --output-format=github .

  test:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: techomato
          POSTGRES_USER: techomato
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U techomato -d techomato"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Tests run with config.settings_test (in-memory cache/mail, eager Celery); only PostgreSQL is real.
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: techomato
      POSTGRES_USER: techomato
      POSTGRES_PASSWORD: ci_only_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Test suite with coverage
        run: pytest -q --cov=apps --cov=config --cov-report=term-missing --cov-report=xml --cov-fail-under=95
      - name: Coverage summary
        if: always()
        run: |
          echo "### Test coverage" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse("coverage.xml").getroot()
              print(f"Line coverage: **{float(root.get('line-rate')) * 100:.1f}%**")
          except Exception as exc:  # report missing: tests failed earlier
              print(f"No coverage report ({exc})")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  django-checks:
    name: Django checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_ENGINE: sqlite
      DJANGO_DEBUG: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: System checks
        run: python manage.py check
      - name: No model changes without a migration
        run: python manage.py makemigrations --check --dry-run
      - name: Production deployment checks pass with a production-shaped config
        # Throwaway values shaped like a real deploy (HTTPS origins, strong secrets, Secure cookies).
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: q7Vn3xLk9ZpR2mWc8YhT5bJd6FgA1sUe4oNi0KtXvEyB
          DJANGO_ALLOWED_HOSTS: api.example.org
          FRONTEND_URL: https://app.example.org
          CORS_ALLOWED_ORIGINS: https://app.example.org
          CSRF_TRUSTED_ORIGINS: https://app.example.org
          SESSION_COOKIE_SECURE: "true"
          CSRF_COOKIE_SECURE: "true"
          USE_X_FORWARDED_PROTO: "true"
          SECURE_HSTS_SECONDS: "31536000"
          THROTTLE_NUM_PROXIES: "1"
          EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
          ADMIN_EMAIL: ops@example.org
          ADMIN_PASSWORD: Xk29-vLq77-Zp3w-Rt81
          DATABASE_URL: postgresql://app:Zq8vLm3Xw9Rt5YpK2nBd@db.internal/app
        run: python manage.py check --deploy --fail-level ERROR

  docker:
    name: Docker image and Compose files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the production image (no dev dependencies)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: techomato-labs-api:ci
          build-args: INSTALL_DEV=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image runs as non-root and has the app but not the test tooling
        run: |
          test "$(docker run --rm techomato-labs-api:ci id -u)" != "0"
          docker run --rm techomato-labs-api:ci python -c "import django, rest_framework, celery, gunicorn; print('runtime deps ok')"
          if docker run --rm techomato-labs-api:ci python -c "import pytest" 2>/dev/null; then
            echo "pytest is present in the production image"; exit 1
          fi
          test "$(docker run --rm techomato-labs-api:ci sh -c 'ls -A | grep -c "^\.env" || true')" = "0"
      - name: Development compose file is valid
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Production compose file is valid (with and without the Caddy profile)
        run: |
          cp .env.production.example .env.production
          {
            echo "POSTGRES_PASSWORD=ci-placeholder-password"
            echo "REDIS_PASSWORD=ciplaceholderpassword"
            echo "API_DOMAIN=api.example.org"
            echo "ACME_EMAIL=ops@example.org"
          } >> .env.production
          docker compose -f docker-compose.prod.yml --env-file .env.production config --quiet
          docker compose -f docker-compose.prod.yml --env-file .env.production --profile proxy config --quiet
      - name: Caddyfile is valid
        run: |
          docker run --rm -e API_DOMAIN=api.example.org -e ACME_EMAIL=ops@example.org \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
